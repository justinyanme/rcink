[project]
name = "tlsr-layout"
version = "0.1.0"
description = "Mac BLE producer that streams JSON layout DSL to TLSR8258 e-paper tags."
requires-python = ">=3.13"
dependencies = [
  "bleak>=3.0.1",
  "pytest-asyncio>=1.3.0",
  "typer>=0.12",
  "xxhash>=3.4",
]

[project.scripts]
tlsr-layout = "tlsr_layout.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tlsr_layout"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=tlsr_layout --cov-report=term-missing --cov-fail-under=90"
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["src/tlsr_layout"]
