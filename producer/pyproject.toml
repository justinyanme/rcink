[project]
name = "rcink"
version = "0.1.0"
description = "rcink producer: builds DSL pages and pushes to e-ink dashboard devices via Axiom or BLE."
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "loguru>=0.7",
    # dev-cli serial console helper (RCPAPER_DEV_CONSOLE build).
    "pyserial>=3.5",
    # macOS-only EventKit bridge for the Apple Calendar + Reminders sources.
    # pyobjc-framework-EventKit pulls in the Core/Foundation bridges it needs.
    'pyobjc-framework-EventKit>=10.3; sys_platform == "darwin"',
    "bleak>=3.0.1",
    "xxhash>=3.7.0",
    "pillow>=12.2.0",
    "jsonschema>=4.26.0",
]

[project.scripts]
claude-fetch   = "scripts.claude_fetch:app"
codex-fetch    = "scripts.codex_fetch:app"
quote-fetch    = "scripts.quote_fetch:app"
calendar-fetch = "scripts.calendar_fetch:app"
todo-fetch     = "scripts.todo_fetch:app"
github-fetch   = "scripts.github_fetch:app"
overview-fetch = "scripts.overview_fetch:app"
image-fetch    = "scripts.image_fetch:app"
fetch-all      = "scripts.fetch_all:app"
tlsr-push      = "scripts.tlsr_push:app"
keypoint-push  = "scripts.keypoint_push:app"
preview        = "scripts.preview:app"
dev-cli        = "scripts.dev_cli:main"
rcink-goldens  = "rcink.cli_goldens:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-httpx>=0.30",
    "pytest-asyncio>=1.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rcink", "scripts"]

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle: keep whitespace + line rules predictable
    "F",   # Pyflakes: catch name errors + dead code early
    "UP",  # pyupgrade: auto-modernize syntax for >=3.13
    "B",   # flake8-bugbear: fail fast on common foot-guns
    "SIM", # flake8-simplify: trim complex branches for clarity
    "I",   # isort: ensure deterministic import ordering
]
