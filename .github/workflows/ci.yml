name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Runs on the org self-hosted Mac runners (rmbp / rocry-studio): uv, pio, and
# cmake come from the host (brew / ~/.local/bin via the runner plist PATH);
# ~/.platformio persists between runs so no package cache step is needed.
jobs:
  producer:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: uv sync --all-extras
        working-directory: producer
      - run: uv run ruff format --check .
        working-directory: producer
      - run: uv run ruff check .
        working-directory: producer
      - run: uv run pytest
        working-directory: producer

  firmware:
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        target: [s3, t-amoled, c3-x4, rlcd, epd397]
    steps:
      # clean: false keeps gitignored .pio/ between runs (warm incremental
      # builds); checkout still resets all tracked files.
      - uses: actions/checkout@v4
        with:
          clean: false
      # config.h is gitignored (secrets); the example carries every macro the
      # build needs with placeholder values.
      - run: cp firmware/${{ matrix.target }}/include/config.h.example firmware/${{ matrix.target }}/include/config.h
      # Retry once: pioarduino's first build in a fresh .pio registers its
      # file:// tool packages mid-run and can fail with FRAMEWORK_DIR=None
      # (pathlib TypeError); the second run always resolves them. Real
      # compile errors still fail — they just fail twice.
      - run: pio run -d firmware/${{ matrix.target }} || pio run -d firmware/${{ matrix.target }}
      - run: pio test -d firmware/${{ matrix.target }} -e native

  tlsr-host:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S firmware/tlsr/firmware/host_test -B firmware/tlsr/firmware/host_test/build
      - run: cmake --build firmware/tlsr/firmware/host_test/build --target host_test
      - run: uv run --directory firmware/tlsr/firmware/host_test pytest
