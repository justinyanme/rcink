[project]
name = "rcpaper-debug-cli"
version = "0.1.0"
description = "USB-CDC console helper for the rcpapercolor M5 PaperColor firmware"
requires-python = ">=3.13"
dependencies = [
    "loguru>=0.7",
    "pyserial>=3.5",
    "typer>=0.15",
]

[project.scripts]
rcpaper-cli = "rcpaper_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
