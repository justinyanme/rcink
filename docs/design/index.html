<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>rcpapercolor · dashboard explorations</title>
<style>
  html, body {
    margin: 0;
    background: #1A1612;
    color: #ECE5D2;
    font-family: 'Work Sans', system-ui, -apple-system, sans-serif;
    overflow: hidden;
  }
  #root { width: 100vw; height: 100vh; }
  /* e-ink redraw flash animation */
  .pc-flash {
    animation: pc-flash 0.8s steps(4, end) forwards;
  }
  @keyframes pc-flash {
    0%   { opacity: 0; }
    10%  { opacity: 1; }
    20%  { opacity: 0; }
    30%  { opacity: 1; }
    45%  { opacity: 0; }
    60%  { opacity: 1; }
    100% { opacity: 0; }
  }
  /* Make button presses feel a bit tighter */
  button.pc-btn:active {
    box-shadow: inset 0 3px 6px rgba(0,0,0,0.45) !important;
  }
</style>

<!-- React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Palette + measure utilities (plain JS, loads first) -->
<script src="palette.js"></script>

<!-- Components — order matters: protocol → device → pages → simulator → app -->
<script type="text/babel" src="protocol.jsx"></script>
<script type="text/babel" src="device.jsx"></script>
<script type="text/babel" src="pages.jsx"></script>
<script type="text/babel" src="simulator.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="env,react">
  // Delay mount until Babel has transpiled all script[type=text/babel] tags.
  // We poll on `window.App` because it's the last symbol declared.
  function mount() {
    if (!window.App || !window.DesignCanvas || !window.Simulator || !window.PaperColorDevice) {
      return setTimeout(mount, 30);
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  }
  mount();
</script>
</body>
</html>
