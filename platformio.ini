[platformio]
default_envs = m5stack-papercolor

; -----------------------------------------------------------------------------
; Device build
; -----------------------------------------------------------------------------
[env:m5stack-papercolor]
platform = espressif32 @ 6.12.0
board = esp32s3box
framework = arduino
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
monitor_filters = default, esp32_exception_decoder
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    M5Unified = https://github.com/m5stack/M5Unified
    M5GFX = https://github.com/m5stack/M5GFX
    M5PM1 = https://github.com/m5stack/M5PM1
    bblanchon/ArduinoJson@^7.4.2

; -----------------------------------------------------------------------------
; Native tests for pure-logic modules (palette, parser, layout engine)
; -----------------------------------------------------------------------------
[env:native]
platform = native
build_flags =
    -std=gnu++17
    -DUNIT_TEST
    -Isrc
lib_deps =
    bblanchon/ArduinoJson@^7.4.2
test_build_src = yes
; Include pure-logic modules (palette.cpp) only; exclude device main.cpp
build_src_filter = -<main.cpp> +<render/> +<proto/>
