[platformio]
default_envs = m5stack-papercolor

; One firmware: external power keeps USB/console/buttons/scheduler awake;
; battery power follows the existing deep-sleep path.
[env:m5stack-papercolor]
platform = espressif32 @ 6.12.0
board = esp32s3box
framework = arduino
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_upload.after_reset = watchdog_reset
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
monitor_filters = default, esp32_exception_decoder
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; Dev: uncomment to skip the slow color-eink paint while iterating on
    ; WiFi/Axiom/parser/layout. Keeps the existing image on screen between
    ; wakes and short-circuits paint to a Serial line.
    ; -DRCPAPER_DEV_NO_DRAW
; M5 libs pinned to the HW-validated set (May 2026 bring-up + 2026-06-05
; production verify on this unit). Unpinned git URLs made clean builds pull
; whatever master was current — unvalidated on this panel. Bump deliberately
; and re-verify a real paint on hardware before moving these pins.
lib_deps =
    M5GFX = https://github.com/m5stack/M5GFX#5268353cffabd2925b87ed9bcc05ded4e22cc3d1
    M5Unified = https://github.com/m5stack/M5Unified#46aa9ede24016a70f397884e8fb3c0ccc3a05269
    M5PM1 = https://github.com/m5stack/M5PM1#37d55c2fa88064fcbb18f3a287dc8286a08d5d87
    bblanchon/ArduinoJson@^7.4.2
lib_extra_dirs = ../shared
lib_ignore = rcink-tft

; -----------------------------------------------------------------------------
; Native tests for pure-logic modules (palette, parser, layout engine)
; -----------------------------------------------------------------------------
[env:native]
platform = native
build_flags =
    -std=gnu++17
    -DUNIT_TEST
    -Isrc
lib_deps =
    bblanchon/ArduinoJson@^7.4.2
lib_extra_dirs = ../shared
lib_ignore = rcink-tft
test_build_src = yes
; Include pure-logic modules (palette.cpp) only; exclude device main.cpp
build_src_filter = -<main.cpp> +<render/> +<sense/>
