[platformio]
default_envs = waveshare-s3-epd397-dev
boards_dir = boards

; -----------------------------------------------------------------------------
; Waveshare ESP32-S3-ePaper-3.97 (800x480 4-level grayscale e-paper; ESP32-S3-
; WROOM-1-N16R8, 16 MB flash, 8 MB octal PSRAM). A desk-climate dashboard built
; from the onboard SHTC3 (temp/humidity) + PCF85063 RTC + AXP2101 battery gauge,
; with the AMOLED target's Axiom page-deck reachable as a second mode.
;
; The display stack reuses firmware/rlcd's render pipeline: the scene is composed
; into a 16-bit TFT_eSPI sprite, then quantised by luminance to the panel's 2bpp
; 4-gray buffer at push time (render/gray_pack.cpp -> display/epd397.cpp), so
; antialiased Latin text keeps its gray edges. TFT_eSPI is used purely as a
; sprite/font engine (the ILI9341 setup below is never driven against real
; hardware; we never call tft.init()).
;
;   waveshare-s3-epd397      : production deep-sleep loop (HIL gate before default)
;   waveshare-s3-epd397-dev  : cable-driven USB-CDC console, no deep sleep (default)
; -----------------------------------------------------------------------------
[epd397-base]
platform = espressif32 @ 6.12.0
board = waveshare-s3-epd397
framework = arduino
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
monitor_filters = default, esp32_exception_decoder
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    ; U8g2_for_TFT_eSPI is GitHub-only (not in the PIO registry); renders the
    ; baked WenQuanYi GB2312 font (render/fonts/wqy16_gb2312.h) into the sprite
    ; for the Axiom deck's CJK text. Pinned to the repo's single stable commit.
    https://github.com/Bodmer/U8g2_for_TFT_eSPI.git#a170ef8b6d8414b1ee2ecc97b5b913e08f5597ac
    bblanchon/ArduinoJson@^7.4.2
    ; AXP2101 PMIC fuel gauge (battery percent/voltage). Battery-only; rails are
    ; left untouched — the panel rail is on by default.
    lewisxhe/XPowersLib@^0.2.7
lib_extra_dirs = ../shared
build_flags =
    -Iinclude
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; TFT_eSPI is configured as a generic driver only to satisfy its build; the
    ; sprite is memory-only and the real panel is driven by display/epd397.cpp.
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTOUCH_CS=-1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    ; Crisp proportional Free fonts (FreeSans/FreeSansBold) for the dashboard
    ; hero + the deck's page text.
    -DLOAD_GFXFF=1

[env:waveshare-s3-epd397]
extends = epd397-base

[env:waveshare-s3-epd397-dev]
extends = epd397-base
build_flags =
    ${epd397-base.build_flags}
    -DRCEPD397_DEV_CONSOLE

; -----------------------------------------------------------------------------
; Native tests for pure-logic modules (palette, parser, layout engine, the
; 4-gray packing in render/gray_pack.cpp).
; -----------------------------------------------------------------------------
[env:native]
platform = native
build_flags =
    -std=gnu++17
    -DUNIT_TEST
    -Isrc
lib_deps =
    bblanchon/ArduinoJson@^7.4.2
lib_extra_dirs = ../shared
test_build_src = yes
build_src_filter = -<main.cpp> -<display/> -<dev/> -<net/> -<store/> -<sense/> +<render/>
