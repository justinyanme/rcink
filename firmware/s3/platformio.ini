[platformio]
default_envs = m5stack-papercolor

; -----------------------------------------------------------------------------
; Device builds — two envs share everything except the dev-console flag.
;   m5stack-papercolor      : production build, full deep-sleep loop
;                             (DEFAULT; flash this for battery use)
;   m5stack-papercolor-dev  : dev build, USB-CDC console, NO deep sleep
;                             (use with a cable for iteration)
; The default env must be the battery-correct build: a forgotten `-e` flag
; should never silently ship the no-sleep console firmware (it never schedules
; the timer wake, so it stops refreshing and drains the battery).
; Flash the dev console with:
;   pio run -e m5stack-papercolor-dev -t upload
; -----------------------------------------------------------------------------
[m5stack-papercolor-base]
platform = espressif32 @ 6.12.0
board = esp32s3box
framework = arduino
board_build.partitions = partitions.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
monitor_filters = default, esp32_exception_decoder
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; Dev: uncomment to skip the slow color-eink paint while iterating on
    ; WiFi/Axiom/parser/layout. Keeps the existing image on screen between
    ; wakes and short-circuits paint to a Serial line.
    ; -DRCPAPER_DEV_NO_DRAW
; M5 libs pinned to the HW-validated set (May 2026 bring-up + 2026-06-05
; production verify on this unit). Unpinned git URLs made clean builds pull
; whatever master was current — unvalidated on this panel. Bump deliberately
; and re-verify a real paint on hardware before moving these pins.
; KNOWN ISSUE (2026-06-05, unresolved): the -dev env fails display bring-up
; even on these pins — M5 board autodetect skips the PM1 I2C bus (sda=12
; scl=11 never initialized), Display.width()==0, battery reads 0 mV; the
; production env on the same pins detects the board and paints fine. Cause
; not yet isolated; debug the dev console on hardware with this in mind.
lib_deps =
    M5Unified = https://github.com/m5stack/M5Unified#46aa9ede24016a70f397884e8fb3c0ccc3a05269
    M5GFX = https://github.com/m5stack/M5GFX#5268353cffabd2925b87ed9bcc05ded4e22cc3d1
    M5PM1 = https://github.com/m5stack/M5PM1#37d55c2fa88064fcbb18f3a287dc8286a08d5d87
    bblanchon/ArduinoJson@^7.4.2

[env:m5stack-papercolor]
extends = m5stack-papercolor-base
; No RCPAPER_DEV_CONSOLE — setup() enters deep sleep after each render.

[env:m5stack-papercolor-dev]
extends = m5stack-papercolor-base
build_flags =
    ${m5stack-papercolor-base.build_flags}
    ; Dev: USB-CDC command console (see main.cpp::console_dispatch). Keeps
    ; the firmware awake in loop() after the first render so the Mac can
    ; drive `f`/`r`/`n`/`b`/`m`/`s`/... commands. Disables deep sleep.
    -DRCPAPER_DEV_CONSOLE

; -----------------------------------------------------------------------------
; Native tests for pure-logic modules (palette, parser, layout engine)
; -----------------------------------------------------------------------------
[env:native]
platform = native
build_flags =
    -std=gnu++17
    -DUNIT_TEST
    -Isrc
lib_deps =
    bblanchon/ArduinoJson@^7.4.2
test_build_src = yes
; Include pure-logic modules (palette.cpp) only; exclude device main.cpp
build_src_filter = -<main.cpp> +<render/> +<proto/> +<sense/>
