[platformio]
default_envs = c3-x4-dev

; -----------------------------------------------------------------------------
; Xteink X4 — ESP32-C3 (RISC-V, NO PSRAM, ~380KB RAM, 16MB flash) driving a
; SSD1677 / GDEQ0426T82 4.26" 800x480 B&W e-ink panel.
;
; The render stack (engine/fonts/primitives/proto) is shared verbatim with the
; other rcink targets: it composes a page into an off-screen TFT_eSprite. The C3
; cannot hold a 16-bit 800x480 sprite (750KB), so this target composes into a
; *1-bit* sprite (48KB) and packs it into the SSD1677 framebuffer. TFT_eSPI is
; used only as a sprite/font engine (configured as ILI9341, never tft.init()'d).
;
; The panel itself is driven by the vendored EInkDisplay library (lib/), proven
; on this exact hardware by the crosspoint-reader firmware. Single-buffer mode
; keeps the controller's RED RAM as the previous-frame store (48KB total).
; -----------------------------------------------------------------------------
; Shared base for the two on-device envs. NOT named [env] so the `native` test
; env (a different platform with no board) doesn't inherit `board` and choke.
[c3]
; pioarduino fork (Arduino core 3.x / ESP-IDF 5.5) — the platform the X4
; reference firmware (crosspoint-reader) is built against, and the only one with
; the RISC-V toolchain already installed on this machine. The stock
; `espressif32 @ 6.12.0` pins an old riscv toolchain that is not cached.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
board_build.partitions = partitions.csv
board_build.flash_mode = dio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
monitor_speed = 115200
monitor_filters = default, esp32_exception_decoder
; Do not toggle DTR/RTS on monitor open — on the C3 USB-CDC that can latch the
; chip into the ROM download stub (firmware never runs). esptool still resets
; correctly for uploads via its own sequence.
monitor_dtr = 0
monitor_rts = 0
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    ; U8g2_for_TFT_eSPI is GitHub-only (not in the PIO registry); renders the
    ; baked WenQuanYi GB2312 font (render/fonts/wqy16_gb2312.h) into the sprite.
    https://github.com/Bodmer/U8g2_for_TFT_eSPI.git#a170ef8b6d8414b1ee2ecc97b5b913e08f5597ac
    bblanchon/ArduinoJson@^7.4.2
lib_extra_dirs = ../shared
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    ; SSD1677 single-buffer mode (48KB framebuffer; critical on the C3).
    -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
    ; TFT_eSPI as a pure sprite/font engine (no real panel is ever init()'d).
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTOUCH_CS=-1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DRCX4_DEV_CONSOLE

; Full firmware: WiFi + NTP + Axiom page-deck + e-ink render.
[env:c3-x4-dev]
extends = c3
build_src_filter = +<*> -<bringup.cpp>

; Standalone SSD1677 bring-up: test pattern only, no WiFi/render. Validates the
; vendored driver on real hardware in isolation. Needs only the local EInkDisplay
; lib, so drop the shared lib_deps to keep this env fully offline.
[env:c3-x4-bringup]
extends = c3
lib_deps =
build_src_filter = -<*> +<bringup.cpp>

; -----------------------------------------------------------------------------
; Native tests for pure-logic modules (palette, parser, layout engine, mono pack)
; -----------------------------------------------------------------------------
[env:native]
platform = native
build_flags =
    -std=gnu++17
    -DUNIT_TEST
    -Isrc
lib_deps =
    bblanchon/ArduinoJson@^7.4.2
lib_extra_dirs = ../shared
test_build_src = yes
build_src_filter = -<main.cpp> -<bringup.cpp> -<display/> -<dev/> -<net/> -<store/> -<sense/> +<render/>
