[platformio]
default_envs = waveshare-s3-rlcd
boards_dir = boards

; -----------------------------------------------------------------------------
; Waveshare ESP32-S3-RLCD-4.2 (ST7305 4.2" mono reflective LCD, 400x300, 1bpp;
; ESP32-S3-PICO-1, 8 MB flash, 8 MB PSRAM on the board in hand). A desk-climate dashboard built from the onboard
; SHTC3 (temp/humidity) + PCF85063 RTC + battery ADC, with the AMOLED target's
; Axiom page-deck reachable as a second mode.
;
; The display stack reuses firmware/t-amoled's render pipeline: the scene is
; composed into a 16-bit TFT_eSPI sprite, then thresholded + packed to the
; ST7305's native 1bpp buffer at push time (display/st7305.cpp). TFT_eSPI is
; used purely as a sprite/font engine (the ILI9341 setup below is never driven
; against real hardware; we never call tft.init()).
;
;   waveshare-s3-rlcd      : production deep-sleep loop (default)
;   waveshare-s3-rlcd-dev  : cable-driven USB-CDC console, no deep sleep
; -----------------------------------------------------------------------------
[rlcd-base]
platform = espressif32 @ 6.12.0
board = waveshare-s3-rlcd
framework = arduino
board_build.partitions = partitions.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
monitor_filters = default, esp32_exception_decoder
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    ; U8g2_for_TFT_eSPI is GitHub-only (not in the PIO registry); renders the
    ; baked WenQuanYi GB2312 font (render/fonts/wqy16_gb2312.h) into the sprite
    ; for the Axiom deck's CJK text. Pinned to the repo's single stable commit.
    https://github.com/Bodmer/U8g2_for_TFT_eSPI.git#a170ef8b6d8414b1ee2ecc97b5b913e08f5597ac
    bblanchon/ArduinoJson@^7.4.2
lib_extra_dirs = ../shared
build_flags =
    -Iinclude
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DRCRLCD_DEFAULT_DARK_MODE=1
    ; TFT_eSPI is configured as a generic driver only to satisfy its build; the
    ; sprite is memory-only and the real panel is driven by display/st7305.cpp.
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTOUCH_CS=-1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    ; Crisp proportional Free fonts (FreeSans/FreeSansBold) for the dashboard
    ; hero + the deck's page text.
    -DLOAD_GFXFF=1

[env:waveshare-s3-rlcd]
extends = rlcd-base

[env:waveshare-s3-rlcd-dev]
extends = rlcd-base
build_flags =
    ${rlcd-base.build_flags}
    -DRCRLCD_DEV_CONSOLE

; -----------------------------------------------------------------------------
; Native tests for pure-logic modules (palette, parser, layout engine, the
; ST7305 1bpp packing in render/mono_pack.cpp).
; -----------------------------------------------------------------------------
[env:native]
platform = native
build_flags =
    -std=gnu++17
    -DUNIT_TEST
    -Isrc
lib_deps =
    bblanchon/ArduinoJson@^7.4.2
lib_extra_dirs = ../shared
test_build_src = yes
build_src_filter = -<main.cpp> -<display/> -<dev/> -<net/> -<store/> -<sense/> +<render/>
