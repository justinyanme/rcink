[platformio]
default_envs = m5stack-papercolor-lab

; Lab firmware: panel driver + line console only. Same pinned platform, board
; and partition table as ../papercolor so scripts/papercolor_flash.py writes it
; app-only. No M5Stack library: every controller byte is this repo's code.
[env:m5stack-papercolor-lab]
platform = espressif32 @ 6.12.0
board = esp32s3box
framework = arduino
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_upload.after_reset = watchdog_reset
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
monitor_filters = default, esp32_exception_decoder
extra_scripts = pre:build_hash.py
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Isrc/shim
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =

; Host tests for the pure modules: console protocol, frame encoder, images, init table.
[env:native]
platform = native
build_flags =
    -std=gnu++17
    -DUNIT_TEST
    -Isrc
    -Isrc/shim
test_build_src = yes
build_src_filter = +<protocol.cpp> +<frame.cpp> +<image.cpp>
