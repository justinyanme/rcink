[platformio]
default_envs = lilygo-t-amoled-dev
boards_dir = boards

; -----------------------------------------------------------------------------
; LILYGO T-Display-S3 AMOLED 1.91" (RM67162, ESP32-S3R8, 240x536).
;
; The default env is the cable-driven dev build: USB-CDC console, no deep sleep.
; Production sleep can be added once battery behavior has been measured on this
; board. This target intentionally stays separate from firmware/s3 because the
; display stack is TFT_eSPI sprite + LILYGO RM67162 QSPI, not M5GFX/M5Unified.
; -----------------------------------------------------------------------------
[env:lilygo-t-amoled-dev]
platform = espressif32 @ 6.12.0
board = lilygo-t-amoled
framework = arduino
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
monitor_filters = default, esp32_exception_decoder
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    ; U8g2_for_TFT_eSPI is GitHub-only (not in the PIO registry); renders the
    ; baked WenQuanYi GB2312 font (render/fonts/wqy16_gb2312.h) into the sprite.
    ; Pinned to the repo's single, stable commit.
    https://github.com/Bodmer/U8g2_for_TFT_eSPI.git#a170ef8b6d8414b1ee2ecc97b5b913e08f5597ac
    bblanchon/ArduinoJson@^7.4.2
lib_extra_dirs = ../shared
build_flags =
    -Iinclude
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DRCAMOLED_DEV_CONSOLE
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTOUCH_CS=-1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    ; Crisp proportional Free fonts (FreeSans/FreeSansBold) for page text —
    ; the GLCD/Font ladder looked blocky at the sizes the fit pass picks.
    -DLOAD_GFXFF=1

; -----------------------------------------------------------------------------
; Native tests for pure-logic modules (palette, parser, layout engine)
; -----------------------------------------------------------------------------
[env:native]
platform = native
build_flags =
    -std=gnu++17
    -DUNIT_TEST
    -Isrc
lib_deps =
    bblanchon/ArduinoJson@^7.4.2
lib_extra_dirs = ../shared
test_build_src = yes
build_src_filter = -<main.cpp> -<display/> -<dev/> -<net/> -<store/> -<sense/> +<render/>
